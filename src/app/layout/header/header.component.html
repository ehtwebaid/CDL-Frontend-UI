 <header class="tm-header">
   <div class="tm-header-top d-none d-sm-none d-md-none d-lg-block d-xl-block">
     <div class="container">
       <div class="row">
         <div class="col-md-12">
           <div class="tm-header-logo">
             <a [routerLink]="'/'"><img src="assets/img/logo.png" alt="" class="img-fluid"></a>
           </div>
         </div>
       </div>
     </div>
   </div>
   <div class="tm-header-menu page-header">
     <div class="container">
       <nav class="navbar navbar-expand-lg">
         <div class="container-fluid">
           <a class="navbar-brand d-block d-sm-block d-md-block d-lg-none d-xl-none" [routerLink]="'/'"><img
               src="assets/img/logo.png" alt="" class="img-fluid"></a>
           <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
             data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
             aria-label="Toggle navigation">
             <span class="navbar-toggler-icon"></span>
           </button>
           <div class="collapse navbar-collapse tm-header-menu-list" id="navbarSupportedContent">
             <ul class="navbar-nav me-auto mb-2 mb-lg-0">
               <li class="nav-item">
                 <a class="nav-link " [routerLinkActive]="['active']" [routerLinkActiveOptions]="{ exact: true }" aria-current="page" [routerLink]="'/home'">Home</a>
               </li>
               <li class="nav-item">
                 <a class="nav-link" [routerLinkActive]="['active']" [routerLinkActiveOptions]="{ exact: true }" aria-current="page" [routerLink]="'/study-material'">Study Materials</a>
               </li>
               <li class="nav-item">
                 <a class="nav-link" [routerLinkActive]="['active']" aria-current="page"  [routerLink]="'/exam'">Examination</a>
               </li>
             </ul>
             <div class="tm-menu-btn" *ngIf="!(userInfo$ | async)">
               <a [routerLink]="'/login'" class="tm-btn-main">Login / Signup</a>
             </div>
             <div class="tm-menu-btn" *ngIf="userInfo$ | async">
              <button class="tm-btn-main" (click)="logout()">Logout</button>
            </div>
           </div>
         </div>
       </nav>
     </div>
   </div>
 </header>
